<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agendar</title><link rel="stylesheet" href="css/app.css"></head><body>
<div id="bookingApp"><header class="header"><div class="container nav"><a class="brand" href="javascript:history.back()"><img data-logo hidden><span data-tenant-name>Barbearia</span></a><nav class="navlinks"><a href="javascript:history.back()">← Voltar</a></nav></div></header>
<main class="container"><div class="form-shell"><aside class="card sticky"><span class="eyebrow">AGENDAMENTO</span><h1>Reserve seu horário.</h1><p class="subtitle">Escolha serviço, barbeiro, data e horário disponível.</p><div class="notice"><strong>Resumo</strong><br>Barbeiro: <span id="sumBarber">—</span><br>Serviço: <span id="sumService">—</span><br>Valor: <span id="sumPrice">—</span><br>Data: <span id="sumDate">—</span><br>Horário: <span id="sumTime">—</span></div><div id="success" class="notice" hidden style="margin-top:12px;border-color:rgba(92,199,136,.4)">✓ Agendamento confirmado.<br>Protocolo: <strong id="protocol"></strong></div></aside>
<section class="card"><form id="bookingForm" class="form-grid"><div class="field"><label>Nome</label><input name="name" required maxlength="80"></div><div class="field"><label>WhatsApp</label><input name="phone" required maxlength="25"></div><div class="field full"><label>Serviço</label><select id="service" name="service" required></select></div><div class="field full"><label>Barbeiro</label><select id="barber" name="barber" required></select></div><div class="field full"><label>Data</label><input id="date" name="date" type="date" required></div><div class="field full"><label>Horários</label><div id="times" class="time-grid"><div class="empty">Escolha serviço, barbeiro e data.</div></div></div><div class="field full"><label>Observação</label><textarea name="notes" rows="4"></textarea></div><div class="field full"><button class="btn btn-primary" type="submit">Confirmar agendamento</button></div></form></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/booking.js"></script></body></html>
