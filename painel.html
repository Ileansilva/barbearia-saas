<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel da Barbearia</title><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/dashboard.css"></head><body>
<div id="dashboardShell" class="dashboard">
<aside class="sidebar"><a class="side-brand" href="painel.html"><span data-product-name>Minha Plataforma</span></a><select id="tenantSelect" class="tenant-select"></select><nav class="side-nav" style="margin-top:18px"><button class="active" data-panel="overview">Visão geral</button><button data-panel="appointments">Agendamentos</button><button data-panel="services">Serviços</button><button data-panel="barbers">Barbeiros</button><button data-panel="branding">Identidade</button><button data-panel="settings">Funcionamento</button><button data-panel="plan">Plano</button></nav></aside>
<main class="main"><div class="topbar"><div><span class="eyebrow">PAINEL DA BARBEARIA</span><h1 data-tenant-name>Barbearia</h1></div><div class="top-actions"><a id="publicLink" class="btn btn-outline" target="_blank">Ver site</a><button id="logout" class="btn btn-outline">Sair</button></div></div>
<section id="overview" class="panel active"><div class="kpis"><div class="kpi"><span>Hoje</span><strong id="kToday">0</strong></div><div class="kpi"><span>Mês</span><strong id="kMonth">0</strong></div><div class="kpi"><span>Faturamento</span><strong id="kRevenue">R$ 0</strong></div><div class="kpi"><span>Serviços</span><strong id="kServices">0</strong></div><div class="kpi"><span>Barbeiros</span><strong id="kBarbers">0</strong></div></div></section>
<section id="appointments" class="panel"><div class="card"><h2>Agendamentos</h2><div class="table-wrap"><table class="table"><thead><tr><th>Cliente</th><th>Barbeiro</th><th>Serviço</th><th>Data</th><th>Valor</th><th>Status</th><th>Obs.</th><th>Ações</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></section>
<section id="services" class="panel"><div class="card"><h2>Adicionar / editar serviço</h2><form id="serviceForm" class="form-grid"><input id="serviceId" name="id" type="hidden"><div class="field"><label>Nome</label><input id="serviceName" name="name" required></div><div class="field"><label>Preço</label><input id="servicePrice" name="price" type="number" step=".01" required></div><div class="field"><label>Duração (min)</label><input id="serviceDuration" name="duration" type="number" min="10" required></div><div class="field"><label>Ordem</label><input id="serviceSort" name="sort_order" type="number" value="0"></div><div class="field full"><label>Descrição</label><textarea id="serviceDescription" name="description"></textarea></div><div class="field full"><label>URL da imagem</label><input id="serviceImage" name="image_url"></div><div class="field full"><button class="btn btn-primary">Salvar serviço</button></div></form></div><div id="serviceAdminGrid" class="admin-grid"></div></section>
<section id="barbers" class="panel"><div class="card"><h2>Adicionar / editar barbeiro</h2><form id="barberForm" class="form-grid"><input id="barberId" name="id" type="hidden"><div class="field"><label>Nome</label><input id="barberName" name="name" required></div><div class="field"><label>Ordem</label><input id="barberSort" name="sort_order" type="number" value="0"></div><div class="field full"><label>URL da foto</label><input id="barberPhoto" name="photo_url"></div><div class="field full"><button class="btn btn-primary">Salvar barbeiro</button></div></form></div><div id="barberAdminGrid" class="admin-grid"></div></section>
<section id="branding" class="panel"><div class="card"><h2>Identidade visual</h2><form id="brandingForm" class="form-grid"><div class="field full"><label>Nome da barbearia</label><input id="brandName" name="name"></div><div class="field full"><label>URL da logo</label><input id="brandLogo" name="logo_url"></div><div class="field full"><label>Imagem de capa</label><input id="brandHero" name="hero_image_url"></div><div class="field"><label>Cor principal</label><input id="brandPrimary" name="brand_primary" type="color"></div><div class="field"><label>Cor destaque</label><input id="brandSecondary" name="brand_secondary" type="color"></div><div class="field full"><label>Texto principal</label><textarea id="brandHeroText" name="hero_text"></textarea></div><div class="field full"><label>Sobre</label><textarea id="brandAbout" name="about_text"></textarea></div><div class="field full"><button class="btn btn-primary">Salvar identidade</button></div></form></div></section>
<section id="settings" class="panel"><div class="card"><h2>Contato e funcionamento</h2><form id="settingsForm" class="form-grid"><div class="field"><label>WhatsApp</label><input id="phone" name="phone"></div><div class="field"><label>Instagram</label><input id="instagram" name="instagram"></div><div class="field full"><label>Endereço</label><input id="address" name="address"></div><div class="field"><label>Abertura</label><input id="openTime" name="open_time" type="time"></div><div class="field"><label>Fechamento</label><input id="closeTime" name="close_time" type="time"></div><div class="field"><label>Intervalo (min)</label><input id="interval" name="slot_interval" type="number"></div><div class="field full"><label>Dias (0=dom ... 6=sáb)</label><input id="workDays" name="work_days"></div><div class="field full"><label>Datas bloqueadas</label><input id="blockedDates" name="blocked_dates"></div><div class="field full"><button class="btn btn-primary">Salvar funcionamento</button></div></form></div></section>
<section id="plan" class="panel"><div class="card"><h2>Plano atual</h2><div id="subscriptionInfo" class="plan-box">Carregando...</div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/supabase-client.js"></script><script src="js/dashboard.js"></script></body></html>
